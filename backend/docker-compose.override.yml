# ============================================================
# Docker Compose 覆寫檔（開發環境專用）
# ============================================================
# 此檔案會自動與 docker-compose.yml 合併。
# 只需定義「與正式環境不同的部分」，其餘沿用主設定。
#
# 合併規則：
#   - 純值屬性（如 target）→ 直接覆寫
#   - 陣列屬性（如 volumes）→ 附加合併
#   - 未在此檔案出現的屬性 → 保留主設定的值
#
# 若要跳過此覆寫檔，只跑正式環境：
#   docker compose -f docker-compose.yml up -d
# ============================================================

version: "3.8"

services:
  # ----------------------------------------------------------
  # app 服務 — 開發環境覆寫
  # ----------------------------------------------------------
  app:
    build:
      # 覆寫 target 為 development 階段
      # development 階段額外包含 Node.js（用於 npm run dev / hot reload）
      # 並使用 entrypoint.sh 進行初始化（建立 storage 目錄、設定權限等）
      target: development

    volumes:
      # Bind Mount：將主機的專案目錄掛載到容器內
      # 修改本機程式碼 → 容器內即時同步 → 不需重新 build Image
      # 這是開發環境的核心：讓你可以用本機編輯器寫 code，容器即時反映
      # 注意：正式環境不使用 Bind Mount，程式碼是 COPY 進 Image 的
      - .:/var/www/html

  # ----------------------------------------------------------
  # db 服務 — 開發環境覆寫
  # ----------------------------------------------------------
  db:
    ports:
      # 開發環境才開放 MySQL port 到主機
      # 讓你可以用本機的 DB 工具（如 TablePlus、DBeaver）直接連線
      # 正式環境不暴露此 port，db 只能透過 backend 內部網路存取
      - "3306:3306"
